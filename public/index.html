<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe66d" />
  <title>The Very Hungry Caterpillar Game</title>
  <meta name="description" content="Guide the very hungry caterpillar through a week of eating — one apple on Monday, two pears on Tuesday… all the way to a beautiful butterfly." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐛%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --sun: #ffe66d;
      --cream: #fff8e1;
      --leaf: #6cbf3a;
      --leaf-dark: #3f8f1f;
      --red: #e2402f;
      --ink: #2b2b2b;
      --purple: #7c4dff;
      --card: #ffffffee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Baloo 2", "Nunito", "Segoe UI Rounded", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #fff2a8 0 90px, transparent 91px),
        radial-gradient(circle at 90% 90%, #c9efb0 0 140px, transparent 141px),
        linear-gradient(180deg, #fff8e1 0%, #eaf7dc 100%);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .app {
      width: 100%;
      max-width: 640px;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    header.top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
    }
    .day-badge {
      background: var(--red);
      color: #fff;
      font-weight: 800;
      letter-spacing: .02em;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #a52a1c;
      font-size: 15px;
      white-space: nowrap;
    }
    .goal {
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
    }
    .hud .hearts { letter-spacing: 1px; color: var(--red); }
    .hud .score { background: #fff; padding: 4px 10px; border-radius: 999px; border: 2px solid #e6d9a0; font-variant-numeric: tabular-nums; }

    .stage {
      position: relative;
      width: 100%;
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(60, 80, 20, .18), inset 0 0 0 4px #fff;
      background: #fdf6dc;
      touch-action: none;
      transition: transform .3s ease;
    }
    .stage.queasy { animation: wobble var(--wobble-speed, 2.2s) ease-in-out infinite; }
    @keyframes wobble {
      0%, 100% { transform: rotate(calc(var(--wobble, 0.4) * -1deg)) scale(1); }
      50% { transform: rotate(calc(var(--wobble, 0.4) * 1deg)) scale(1.005); }
    }
    .stage.hurt { animation: hurt .35s ease; }
    @keyframes hurt {
      0%, 100% { transform: translateX(0); filter: none; }
      25% { transform: translateX(-6px); filter: saturate(.4); }
      75% { transform: translateX(6px); filter: saturate(.4); }
    }
    canvas#game { display: block; width: 100%; height: 100%; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(255, 248, 225, .78);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 1;
      transition: opacity .25s ease;
    }
    .overlay[hidden] { display: none; }
    .overlay.clear { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; pointer-events: none; align-items: flex-end; }
    .overlay.clear .card { padding: 12px 14px; }
    .overlay.clear .card h2 { font-size: 19px; }
    .overlay.clear .card p { font-size: 14px; margin: 4px 0; }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 16px 16px 14px;
      max-height: 100%;
      overflow-y: auto;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      border: 3px solid #fff;
      pointer-events: auto;
    }
    .card h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.1; }
    .card h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.15; }
    .card p { margin: 6px 0; font-size: 15px; line-height: 1.35; }
    .card .big { font-size: 40px; line-height: 1; margin: 2px 0 6px; }
    .card .foods { font-size: 28px; letter-spacing: 4px; margin: 6px 0 10px; line-height: 1.3; }
    .card .hint { font-size: 13px; color: #666; margin-top: 10px; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      background: var(--leaf);
      color: #fff;
      box-shadow: 0 4px 0 var(--leaf-dark);
      transition: transform .05s ease, box-shadow .05s ease;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--leaf-dark); }
    .btn.secondary { background: #fff; color: var(--ink); box-shadow: 0 4px 0 #d9ccA0; border: 2px solid #e6d9a0; }
    .btn.secondary:active { box-shadow: 0 1px 0 #d9cca0; }
    .btn.red { background: var(--red); box-shadow: 0 4px 0 #a52a1c; }
    .btn.red:active { box-shadow: 0 1px 0 #a52a1c; }
    .btn.small { padding: 8px 14px; font-size: 14px; }
    select.btn { padding-right: 28px; background-image: none; }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    .side { display: flex; gap: 8px; flex-wrap: wrap; }
    .side.right { justify-content: flex-end; }
    .icon-btn {
      appearance: none;
      border: 2px solid #e6d9a0;
      background: #fff;
      border-radius: 14px;
      width: 46px; height: 46px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 3px 0 #d9cca0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d9cca0; }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(3, 54px);
      gap: 4px;
    }
    .dpad button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      background: var(--leaf);
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--leaf-dark);
      cursor: pointer;
      touch-action: none;
    }
    .dpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--leaf-dark); }
    .dpad .u { grid-area: 1 / 2; }
    .dpad .l { grid-area: 2 / 1; }
    .dpad .r { grid-area: 2 / 3; }
    .dpad .d { grid-area: 3 / 2; }
    .dpad .c { grid-area: 2 / 2; background: transparent; box-shadow: none; font-size: 28px; pointer-events: none; }
    @media (min-width: 760px) and (hover: hover) and (pointer: fine) {
      .dpad { display: none; }
      .controls { grid-template-columns: 1fr 1fr; }
    }
    @media (max-height: 720px) {
      footer.credit { display: none; }
      .dpad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
      .dpad button { font-size: 20px; }
      .icon-btn { width: 42px; height: 42px; }
      .card .big { display: none; }
      .card h1 { font-size: 22px; }
      .card p { font-size: 14px; margin: 4px 0; }
      .card .hint, .card .more { display: none; }
    }
    footer.credit { font-size: 12px; color: #6b6b6b; text-align: center; line-height: 1.4; }
    footer.credit a { color: inherit; }

    /* Share modal */
    .modal {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(30, 40, 10, .55);
      padding: 16px;
      z-index: 10;
    }
    .modal[hidden] { display: none; }
    .modal .card { max-width: 380px; }
    .qr-wrap { background: #fff; display: inline-block; padding: 10px; border-radius: 14px; border: 3px solid var(--sun); margin: 6px 0; }
    .qr-wrap canvas { display: block; width: 240px; height: 240px; image-rendering: pixelated; }
    .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; background: #f6f2e3; padding: 8px 10px; border-radius: 10px; user-select: all; -webkit-user-select: all; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px;
      font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20;
    }
    .toast.show { opacity: 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="day-badge" id="dayBadge">Sunday</div>
      <div class="goal" id="goal">A tiny egg lies on a leaf…</div>
      <div class="hud">
        <span class="hearts" id="hearts" aria-label="lives">❤❤❤</span>
        <span class="score" id="score">0</span>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="game" aria-label="Hungry caterpillar game board" role="img"></canvas>
      <div class="overlay" id="overlay">
        <div class="card" id="card"></div>
      </div>
    </div>

    <div class="controls">
      <div class="side">
        <button class="icon-btn" id="pauseBtn" title="Pause (space)" aria-label="Pause">⏸</button>
        <button class="icon-btn" id="soundBtn" title="Sound" aria-label="Toggle sound">🔊</button>
      </div>
      <div class="dpad" aria-label="Direction pad">
        <button class="u" data-dir="up" aria-label="Up">▲</button>
        <button class="l" data-dir="left" aria-label="Left">◀</button>
        <button class="c" tabindex="-1" aria-hidden="true">🐛</button>
        <button class="r" data-dir="right" aria-label="Right">▶</button>
        <button class="d" data-dir="down" aria-label="Down">▼</button>
      </div>
      <div class="side right">
        <button class="icon-btn" id="shareBtn" title="Share QR code" aria-label="Share QR code">📱</button>
      </div>
    </div>

    <footer class="credit">
      Arrow keys / WASD or swipe to steer. Eat the day's food, don't bump into yourself!<br />
      A fan game inspired by Eric Carle's <em>The Very Hungry Caterpillar</em>.
    </footer>
  </main>

  <div class="modal" id="qrModal" hidden>
    <div class="card">
      <h2>Scan to play 🐛</h2>
      <div class="qr-wrap"><canvas id="qrCanvas" width="240" height="240" aria-label="QR code linking to this game"></canvas></div>
      <div class="url" id="shareUrl"></div>
      <div class="row">
        <button class="btn small secondary" id="copyBtn">Copy link</button>
        <button class="btn small secondary" id="downloadQrBtn">Save QR image</button>
        <button class="btn small secondary" id="nativeShareBtn" hidden>Share…</button>
      </div>
      <div class="row"><button class="btn small red" id="closeQrBtn">Close</button></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="qrcode.js"></script>
  <script src="game.js"></script>
</body>
</html>
